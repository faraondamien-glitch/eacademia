name: eacademia
description: EACADEMIA — Espace personnalisé Granions pour les professionnels de santé
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase (v3 — Firebase iOS SDK 11.x, compatible Xcode 15+/26)
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0

  # Notifications locales
  flutter_local_notifications: ^17.0.0

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3

  # HTTP
  dio: ^5.4.1

  # Images
  cached_network_image: ^3.3.1

  # Video
  video_player: ^2.8.3
  chewie: ^1.7.4

  # PDF
  flutter_pdfview: ^1.3.2

  # Partage
  share_plus: ^7.2.2

  # Stockage sécurisé
  flutter_secure_storage: ^9.0.0

  # Fichiers temporaires (PDF cache)
  path_provider: ^2.1.5

  # Internationalisation
  intl: ^0.19.0

  # Liens externes (360Learning player)
  url_launcher: ^6.3.0

  # UI helpers
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.0

  # Icônes
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
